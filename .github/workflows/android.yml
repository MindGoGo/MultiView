# Android 版的測試、編譯、發佈（規格 android-app R145）
# - 推送到分支而且有改到 android/ 或共用檔案：跑 android/core 的單元測試，編譯 debug 版 APK（放在 Actions 的 Artifacts）
# - 自動發佈：測試通過後，如果 android/gradle.properties 的版本號還沒有 android-v<版本號> 的 Release，
#   自動建立標籤與 Release，放上簽章的 APK（升版本號再推送就會發佈新版）
# - 也可以手動推送（或在 GitHub 網頁建立）android-v<版本號> 標籤，做法相同
name: Android

on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # Android 版重用桌面版的網頁偵測程式與廣告清單、iOS 版的 yt-dlp 橋接與廣告規則轉換
      - 'electron/webPreload.ts'
      - 'src/lib/**'
      - 'resources/easylist.txt'
      - 'ios/MultiView/YtDlp/mv_bridge.py'
      - 'ios/scripts/easylist-to-webkit.mjs'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  test:
    name: 測試與編譯
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: 判斷要不要發佈
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^multiview\.versionName=//p' gradle.properties | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#android-v}" != "$VERSION" ]; then
              echo "::error::標籤是 $GITHUB_REF_NAME，但 android/gradle.properties 的 multiview.versionName 是 $VERSION"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "推送了標籤 $GITHUB_REF_NAME：發佈 $VERSION"
          elif gh release view "android-v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx "MultiView-Android-$VERSION.apk"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "android-v$VERSION 已經發佈過，這次只測試與編譯（要發佈新版請升 multiview.versionName）"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "android-v$VERSION 還沒有發佈：測試通過後自動發佈"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 單元測試（android/core）
        run: ./gradlew :core:test --console=plain

      - name: 編譯 debug 版
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 檢查 APK
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          ls -lh "$APK"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiView-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: 產生簽章的 APK 並發佈
    if: needs.test.outputs.release == 'true'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.test.outputs.version }}
      TAG: android-v${{ needs.test.outputs.version }}
      APK: MultiView-Android-${{ needs.test.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 還原簽章金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::找不到 Secrets 的 ANDROID_KEYSTORE_BASE64，不能產生發佈用的 APK"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/multiview-release.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "MULTIVIEW_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: 編譯 release 版（簽章）
        env:
          MULTIVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MULTIVIEW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MULTIVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 確認簽章
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          cp "$SRC" "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion):"
          ls -lh "$APK"

      - name: 發佈到 GitHub Releases
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 標籤是在 GitHub 網頁的 Releases 建立的：Release 已經存在，補上標題、說明和 APK
            gh release edit "$TAG" --title "MultiView Android $VERSION" --notes-file release-notes.txt --latest=false
            gh release upload "$TAG" "$APK" --clobber
          else
            # 自動發佈：在這次測試的提交上建立標籤（推送標籤的情況，標籤已經存在，指向同一個提交）。
            # Android 版不標成「最新版本」，README 的桌面版下載連結不受影響
            gh release create "$TAG" "$APK" --title "MultiView Android $VERSION" \
              --notes-file release-notes.txt --latest=false --target "$GITHUB_SHA"
          fi

      - name: 刪除金鑰檔
        if: always()
        run: rm -f "$RUNNER_TEMP/multiview-release.p12"
