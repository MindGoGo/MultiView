# Xcode 專案設定。repo 裡不放 .xcodeproj，由 XcodeGen 產生：cd ios && xcodegen generate（R119）
name: MultiView

options:
  bundleIdPrefix: local.multiview
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

packages:
  MultiViewCore:
    path: MultiViewCore

targets:
  MultiView:
    type: application
    platform: iOS
    sources:
      - MultiView
    dependencies:
      - package: MultiViewCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.multiview.ios
        PRODUCT_NAME: MultiView
        # 發佈新版時改這裡，並推送 ios-v<版本號> 標籤（R143）
        MARKETING_VERSION: 0.0.5
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 沒有 Mac、不在這裡簽章：IPA 由 SideStore 用使用者的 Apple ID 簽章
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: MultiView/Info.plist
      properties:
        CFBundleDisplayName: MultiView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
